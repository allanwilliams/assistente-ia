{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        {% block title %} {% endblock %}
        {% block favicon %} {% endblock %}

        <link rel="stylesheet" href="//stackpath.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
        <link rel="stylesheet" href="{% static 'admin/plugins/select2/select2.min.css' %}">
        <link rel="stylesheet" href="{% static 'css/custom_adminlte/base-v4.css' %}?v=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.6.1/toastify.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
        {% block extrastyle %}{% endblock %}
        <style>
            #preloader {
                position: fixed; 
                width: 100%; 
                height: 100vh; 
                top: 0; 
                left:0;
                display: none;
                opacity: 0.7;
                background-color: rgba(0, 0, 0);
                z-index: 400;
            }
            #preloader .spinner-loader {
                border: 7px solid #f3f3f3;
                border-radius: 50%;
                border-top: 7px solid #2c3b41;
                width: 60px;
                height: 60px;
                -webkit-animation: spin 2s linear infinite; /* Safari */
                animation: spin 2s linear infinite;
            }
            #preloader .wrapper-loader {
                display: flex;
                width: 100%;
                height: 100vh; 
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }
            #preloader .wrapper-loader span {
                color: #fff;
                font-weight: bold;
                margin-top: 5px;
                font-size: 1.4em;
            }

            /* Safari */
            @-webkit-keyframes spin {
                0% { -webkit-transform: rotate(0deg); }
                100% { -webkit-transform: rotate(360deg); }
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            #document {
                position: relative;
                overflow: hidden;
                display: flex;
                height: calc(100vh - 72px);
                width: 100%;
                
            }
            #document #toolbar {
                flex: 13 1 0px;
                overflow: hidden;
                color: #fff;
            
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            #document #toolbar .drag-area {
                padding: 6px 10px;
                text-align: center;
                border: 2px dotted #ccc;
                cursor: pointer;
                border-radius: 8px;
                background-color: #4d5b5f;
            }
            #document #toolbar .drag-active {
                background-color: #899a9f;
            }
            #document #toolbar .drag-area i {
                font-size: 1.5rem;
            }
            #document #toolbar .drag-file {
                margin: 0;
            }
            #document #toolbar .drag-area .drag-area-content {
                margin-top: 5px;
            }

            #document #pdf, #document #media {
                background: rgb(255, 255, 255);
                padding-bottom: 42px;
                flex: 37 1 0px;
                overflow: hidden;
                border: 1px solid lightgrey;
            }

            #document #pdf #pdf-obj-container, 
            #document #media #media-obj-container {
                
                height: 100%;
            }
            .logo-interna-homenagem  {
                display: flex;
                padding-left: 50px;
                justify-content: start;
                align-items: center;
                width: 250px;
                gap: 10px;
            }
            .logo-interna-homenagem  img {
                width: 50px;
            }
            .logo-interna-homenagem h2 {
                font-size: 20px;
                margin: 0;
                font-weight: bold;
            }
            #document-header {
                /* background: #000; */
                /* background: radial-gradient(circle, rgba(0, 94, 60, 1) 0%, rgba(1, 54, 34, 1) 74%, rgba(0, 54, 34, 1) 100%); */
                color: #fff;
                padding: 5px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            #document-header .document-header-links {
                display: flex;
                gap: 20px;
                padding-right: 15px;
            }
            #document-header .document-header-links a {
                color: #fff;
                font-weight: bold;
            }
            #document-header .document-header-links a:hover {
                text-decoration: none;
            }
            #document-header .document-header-links a i {
                margin-right: 5px;
            }
        </style>
    </head>
<body>
   
    <div id="preloader">
        <div class="wrapper-loader">
            <div class="spinner-loader"></div>
            <span>Aguarde...</span>
        </div>
    </div>
    {% block conteudo %}{% endblock %}


    <script src="{% static 'admin/plugins/jQuery/jquery-2.2.3.min.js' %}"></script>
    <!-- jQuery UI 1.11.4 -->
    <script src="{% static 'admin/plugins/jQueryUI/jquery-ui.min.js' %}"></script>
    <!-- Select2 -->
    <script src="{% static 'admin/plugins/select2/select2.full.min.js' %}"></script>
    <!-- Bootstrap 3.3.6 -->
    <script src="{% static 'admin/bootstrap/js/bootstrap.min.js' %}"></script>

    <script src="{% static 'clipboard/clipboard.min.js' %}"></script>
    <script src="{% static 'sweetalert2_v11/sweetalert2.all.min.js' %}" ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.6.1/toastify.min.js"crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script>
        const maxFileSizePdf = 32
        const maxFileSizeMedia = 100

        const documentType = [
            'application/pdf'
        ]
        const audioTypes = [
            'audio/midi',
            'audio/mpeg',
            'audio/webm',
            'audio/ogg',
            'audio/wav',    
        ]
        const videoTypes = [
            'video/webm',
            'video/ogg',
            'video/mp4',
            'video/x-msvideo',
            'video/x-ms-asf',
            'application/vnd.ms-asf',
            '.asf'
        ]
        const mediaTranscriptionTypes = audioTypes.concat(videoTypes)


        $(document).ready(() =>{
            $.ajaxSetup({
                headers: {"X-CSRFToken": '{{ csrf_token }}' },
            });

            $('select:not(.filtered):not(.admin-autocomplete)').select2({dropdownAutoWidth : true});
        })

        function getUserChats(userId, api) {
            return fetch(`/documento/api/${api}/?criado_por=${userId}&ativo=true`)
        }
        function showMessage(text,duration){
            Toastify({
                text,
                duration,
                close: true,
                gravity: "top", // `top` or `bottom`
                position: "center", // `left`, `center` or `right`
                stopOnFocus: true, // Prevents dismissing of toast on hover
                style: {
                    background: "linear-gradient(to right, #00b09b, #96c93d)",
                },
                onClick: function(){} // Callback after click
            }).showToast();
        }
        
        const convertHexToRGBA = (hexCode, opacity = 1) => {  
            let hex = hexCode.replace('#', '');
            
            if (hex.length === 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }    
            
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            
            if (opacity > 1 && opacity <= 100) {
                opacity = opacity / 100;   
            }

            return `rgba(${r},${g},${b},${opacity})`;
        };

        function validateDocument(allowedTypes, target){
            const file = target.files[0]
            return allowedTypes.indexOf(file.type) != -1
        }

        function isValidSizes(maxFileSize, file) {
            const fileName = file.name;
            const fileSize = file.size;

            let sizeInMB = Number.parseFloat(fileSize * 0.000001).toFixed(2);

            if (sizeInMB >= maxFileSize) {
                Swal.fire({
                    icon: "error",
                    title:`O arquivo excede o tamanho máximo de <b>${maxFileSize} mb</b>.`,
                }).then(() => window.location.reload());
                return false
            }

            if (fileName.length > 99) {
                Swal.fire({
                    icon: "error",
                    title:`O nome do arquivo deve ter menos de 100 caracteres.`,
                }).then(() => window.location.reload());
                return false
            }

            return true
        }
    </script>

    {% block extrajs %} {% endblock %}
</body>
</html>
