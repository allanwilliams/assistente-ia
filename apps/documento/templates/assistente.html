{% extends 'chat_base.html' %}
{% load static %}
{% block extrastyle %}
<style>
    main {
        height: 100vh;
        background-image: url("{% static 'imagens/background-lines-blue.jpg' %}");
        background-size: cover;
        background-position: center center;
    }
    #container-chat {
        position: relative;
        width: 100%;
        padding: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: calc(100vh - 100px);
    }
    #container-header {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 10px;
    }
    #container-chat #chat {
        position: relative;
        border-radius: 20px;
        width: 100%;
        max-width: 600px;
        display: none;
    }

    #container-chat #chat .chat-header {
        padding: 10px;
        background: rgb(255, 255, 255);
        display: flex;
        align-items: center;
        justify-content: center;
        border-top-left-radius: 20px;
        border-top-right-radius: 20px;
        background-color: #272e30;
        color: #fff;
        font-weight: bold;
        gap: 10px;
    }

    #container-chat #chat .chat-header .chat-header-main {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #container-chat #chat .chat-header #close-chat {
        position: absolute;
        cursor: pointer;
        top: -5px;
        right: -5px;
        border: 2px solid #fff;
        background-color: #000;
        border-radius: 50%;
        display: block;
        width: 25px;
        height: 25px;
        text-align: center;
    }
    
    #container-chat #chat .chat-header #close-chat i {
        font-size: 20px;
    }

    #container-chat #chat .chat-header img {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: #fff;
    }

    #container-chat #chat .chat-message-row {
        display: flex;
        padding-top: 8px;
        padding-bottom: 8px;
        width: 100%;
    }

    #container-chat #chat .chat-message-row.ai {
        justify-content: flex-start;
    }
    #container-chat #chat .chat-message-row.human {
        justify-content: flex-end;
    }

    #container-chat #chat .chat-message-row.ai .chat-message {
        background-color: #f9f9fe;
    }

    #container-chat #chat .chat-message-row.human .chat-message {
        background-color: #1777ff;
        color: #fff;
    }
    
    #container-chat #chat .chat-message {
        position: relative;
        max-width: 500px;
        border-radius: 8px;
        padding: 6px 12px;
        box-shadow: 0 0 3px #d1d2da;
    }
    #container-chat #chat .chat-message .clipboard-btn-container {
        float: right;
        font-size: 16px;
        margin-right: -6px;
        padding-left: 3px;
        cursor: pointer;
    }

    .conversation-container {
        background-color: #fff;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
    }
   
    #conversation {
        overflow: auto;
        width: 100%;
        display: flex;
        justify-content: center;
        max-height: 400px;
        min-height: 400px;
    }
    #list-messages {
        width: 100%;
        padding: 15px 10px;

    }
    #conversation::-webkit-scrollbar {
        width: 10px !important;
    }
    #conversation::-webkit-scrollbar-thumb {
        border-radius: 5px;
    }
    #chat-footer {
        display: flex;
        justify-content: center;
        border-top: 1px solid gray;
        padding: 8px;
        gap: 5px;
    }

    #chat-form-input {
        width: 100%;
        padding: 5px;
        display: flex;
        align-items: center;
    }
    #chat-form-input input:focus-visible {
        border: none !important;
        outline: none;
    }
     #chat-form-input input {
        padding: 0 5px;
        width: 100%;
        height: 32px;
        margin: 0;
        border: none;
    }

     #chat-form-input button {
        background-color: #fff;
        background-image: url("{% static 'imagens/send-icon.png' %}");
        background-size: contain;
        background-repeat: no-repeat;
        height: 30px;
        width: 30px;
    }

    .escrevendo:after {
        overflow: hidden;
        display: inline-block;
        vertical-align: bottom;
        -webkit-animation: ellipsis steps(4,end) 900ms infinite;      
        animation: ellipsis steps(4,end) 900ms infinite;
        content: "\2026";
        width: 0px;
    }

    @keyframes ellipsis {
        to {
            width: 1.25em;    
        }
    }

    @-webkit-keyframes ellipsis {
        to {
            width: 1.25em;    
        }
    }

    #container-assistentes {
        position: absolute;
        bottom: 25px;
        right: 25px;
    }

    .fab-assistente { 
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        margin: 15px 0;
    }
    .fab-assistente img {
        cursor: pointer;
        width: 65px;
        height: 65px;
        border: 2px solid #fff;
        background: #fff;
        border-radius: 50%;
    }

    #start-chat {
        background-color: #1777ff;
        color: #fff;
        font-weight: bold;        
    }

</style>
{% endblock %}

{% block conteudo %}
<main>
    <section id="container-header">
        <img src="{% static 'imagens/defensoria_logo_branca.png' %}"  width="250">
    </section>
    <section id="container-chat">
        <div id="chat">
            <div class="chat-header">
                <div class="chat-header-main">
                    <img id="chat-assistant-avatar" src="{% static 'imagens/amelia.png' %}" alt="">
                    <h3 id="chat-assistant-name">Amélia</h3>
                </div>
                <span id="close-chat"><i class="fa fa-close"></i></span>
            </div>
            <div class="conversation-container">
                <div id="conversation">
                    <div id="list-messages"></div>
                </div>
                <div id="chat-footer">
                    <form id="chat-form-input">
                        <input placeholder="Escreva sua dúvida aqui" autocomplete="off" type="text" id="chat-input-ask" />
                        <button type="submit" class="btn" id="btn-send-ask"></button>
                    </form>
                    <button id="start-chat" class="btn">
                        <i style="display: none;" class="fa-solid fa-circle-notch fa-spin load-start-chat"></i>
                         iniciar conversa
                    </button>
                </div>
            </div>
        </div>
    </section>
    <div id="container-assistentes">
    </div>
   
    <input type="hidden"  id="user-id" value="{{request.user.id}}">
</main>

{% endblock %}

{% block extrajs %}
<script>
    const inputTxtAsk = $('#chat-input-ask')
    const btnSendAsk = $("#btn-send-ask")
    const listMessagesEl = $("#list-messages")
    const chatFormInput = $("#chat-form-input")
    const body = document.querySelector('body')
    const userId = $("#user-id")
    const listaQuestion = $('#lista-question')
    const inputask = document.querySelector('#chat-input-ask')
    const loader = $("#preloader")
    const chatEl = $("#chat")
    const closeChatEl = $("#close-chat")
    const startChatEl = $("#start-chat")
    const containerAssistentesEl = $("#container-assistentes")
    const chatAssistantAvatarEl = $("#chat-assistant-avatar")
    const chatAssistantNameEl = $("#chat-assistant-name")

    let threadAtual = null
    let assistantsList = []
    let assistantAtualId = null


    $(document).ready(() => {
        
        getAssistants()

        chatFormInput.submit((e) => {
            e.preventDefault()
            const ask = inputTxtAsk.val()
            inputTxtAsk.val('')
            sendAsk(ask)
        })

        closeChatEl.click(clearChat)
        startChatEl.click(newThread)
    })


    function getAssistants() {
        $.ajax({
            type:'GET',
            url: `/documento/api/assistente-perfil/`,
            success: (data) => {
                const { results } = data
                listAssistants(results)
            },
            error: (error) => {
                
            },
        })
    }

    function listAssistants(assistants) {
        assistantsList = assistants
        const htmlAssistants = assistants.map((a) => `
            <div class="fab-assistente" onClick="openChat(${a.id})" >
                <img src="${a.avatar}" alt="">
                <span>${a.nome}</span>
            </div>
        `)
            
        containerAssistentesEl.html(htmlAssistants.join(''))
    }

    function clearChat() {
        chatEl.fadeOut()
        threadAtual = null
    }

    function openChat(assistantId) {
        const assist = assistantsList.filter(e => e.id === assistantId)[0]
        assistantAtualId = assist.id
        chatAssistantAvatarEl.attr('src', assist.avatar)
        chatAssistantNameEl.text(assist.nome)
        chatEl.fadeIn()
        chatFormInput.hide()
        startChatEl.show()
        insertConversation([], assist.apresentacao)
    }

    function fillThread(data) {
        const {id, mensagens } = data
        const initialMsg = "Bem vindo! Sou uma assistente virtual especializada em responder dúvidas sobre direitos do consumidor e estou aqui para ajudá-lo com questões relacionadas à Defensoria Pública do Estado do Ceará. Como posso ajudar você hoje?"
        insertConversation(mensagens, initialMsg)
        chatFormInput.show()
        startChatEl.hide()
        threadAtual = data
    }


    function insertConversation(mensagens, initialMsg) {
        listMessagesEl.empty()
        
        if(initialMsg) {
            const fakeConversation = `
                <div class="chat-message-row ai">
                    <div class="chat-message" style="overflow: hidden;">
                        <div class="chat-message-txt">
                            <p>${initialMsg}</p>
                        </div>
                    </div>
                </div>
            `
            listMessagesEl.append(fakeConversation)
        }

        mensagens.forEach((e) => appendConversation(e))
        showLatestMessage()
    }

    function newThread() {
        $.ajax({
            type:'POST',
            url: `/documento/api/assistente-topico/`,
            data: {
                assistenteId: assistantAtualId 
            },
            beforeSend: () => {
                startChatEl.prop("disabled", true)
                $('.load-start-chat').fadeIn()
            },
            success: (data) => {
                fillThread(data)
            },
            error: (error) => {
                
            },
            complete: () => {
                $('.load-start-chat').fadeOut()
                startChatEl.prop("disabled", false)
            } 
        })

    }

    function getThread(id) {
        if(id) {
            $.ajax({
                type: 'GET',
                url: `/documento/api/assistente-topico/${id}/?criado_por=${userId.val()}`,
                success: (data) => fillThread(data),
                error: (erro) => console.log(erro)
            })
        } else {
            $.ajax({
                type: 'GET',
                url: `/documento/api/assistente-topico/?criado_por=${userId.val()}`,
                success: (data) => { 
                    const { results } = data
                    if(results.length) {
                        fillThread(results[0])
                    } else {
                        clearThread()
                    }
                },
                error: (erro) => clearThread()
            })
            
        }
    }


    function appendConversation(askMsg, loading=true) {
        const getAutor = (autor) => {
            const autores = { 1: 'human', 2: 'ai' }
            return autores[autor] 
        }

        const getClipboardAction = (askMsg) => {
            if(askMsg.id && askMsg.autor === 2) {
                return `<div class="clipboard-btn-container" data-toggle="tooltip" data-placement="left" title="Copiar" ><i class="fa-regular fa-clipboard clipboard-btn" data-clipboard-target="#message-${askMsg.id}"></i></div>`
            }
            return ''
        }

        let textoFormatado = askMsg.texto.replaceAll('\n', '<br>')

        let row = `
                <div class="chat-message-row ${getAutor(askMsg.autor)}">
                    <div class="chat-message" style="overflow: hidden;">
                        <div class="chat-message-txt" id="message-${askMsg.id}"><div> ${textoFormatado}</div> </div>
                    </div>
                </div>
            `
        
        listMessagesEl.append(row)
    }

    function removeLoading() {
        $('#list-messages .escrevendo').parent().parent().parent().remove()
    }

    function showLatestMessage() {
        const conversation = document.querySelector('#conversation')
        const messages = conversation.querySelectorAll('.chat-message-row')
        if(messages.length) {
            messages[messages.length -1].scrollIntoView()
        }
    }

    function sendAsk(texto) {
        const data = {
            topico: threadAtual.id,
            texto: texto,
            autor: 1
        }

        if(texto) {
            $.ajax({
                type:'POST',
                url: `/documento/api/assistente-mensagem/`,
                data: data, 
                beforeSend:() => {
                    btnSendAsk.prop("disabled", true);
                    appendConversation(data)
                    appendConversation({
                        autor: 2,
                        texto: "<span class='escrevendo'>Digitando</span>"
                    })
                    showLatestMessage()
                },
                success: (response) => {
                    removeLoading()
                    appendConversation(response, false)
                    prepareActionsChat() 
                },
                error: (error) => {
                    const mensagem = (error?.responseJSON?.mensagem) ? error?.responseJSON?.mensagem : "Houve um erro ao enviar a pergunta."
                    removeLoading()
                    Swal.fire({
                        icon: "error",
                        title: mensagem,
                    });
                },
                complete: () => {
                    showLatestMessage()
                    btnSendAsk.prop("disabled", false);
                }
            })
        }
    }

    function prepareActionsChat () {
        const clipboard = new ClipboardJS('.clipboard-btn');

        clipboard.on('success', function(e) {
            const el = e.trigger
            e.clearSelection();
            el.classList.remove('fa-clipboard')
            el.classList.add('fa-square-check')

            setTimeout(() => {
                el.classList.remove('fa-square-check')
                el.classList.add('fa-clipboard')
            }, 2000)
        });

        $('[data-toggle="tooltip"]').tooltip()
    }

</script>
{% endblock %}
