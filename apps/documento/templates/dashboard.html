
{% extends 'chat_base.html' %}
{% load static %}
{% block extrastyle %}

<style>
body {
    background: radial-gradient(circle, rgba(0, 94, 60, 1) 0%, rgba(1, 54, 34, 1) 74%, rgba(0, 54, 34, 1) 100%);
}
.texto-body-input{
    border: 1px dashed gray;
    background-color: white;
    padding: 0.2em;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.texto-body{
    padding: 6em;
    background-color: #eaeaea;
    border-radius: 10px;
}
.conteudo{
    width: 70%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2em;
}

#grid-documentos-chats ,#grid-pergunta-chats{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 50px;
}

.texto-header{
    text-align: center;
    color: style='color:#fff;';
}

.titulo-header{
    font-weight: 900;
    font-size: 18px;
    background-color: #eaeaea;
}
.documento-chat{
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #1677ff;
    gap: 10px;
}

.conteudo-documentos{
    display: flex;
    flex-direction: column;
    gap: 1em;
    box-shadow: 0px 2px 3px 0px gray;
    padding: 2em;
    border-radius: 1px 1px 5px 5px;
    background-color: #fff;
}


.titulo-header{
    box-shadow: 0px 0px 2px 0px gray;
    padding: 1em;
    border-radius: 4px 4px 0px 0px;
}

.drag-area-content{
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    color: #6e6e6e;
}

.drag-area{
    width: 100%;
    background-color: white;
    border: 1px dashed gray;
    padding: 0.2em;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;    
}

.btn-remove-chat,.btn-remove-question {
    cursor: pointer;
}

.drag-active {
    background-color: #e9e9e94b !important;
}

.nova-pergunta-bloco{
    display: flex;
    gap: 1em;
    justify-content: flex-start;
    align-items: baseline;
}

.cab {
    display: flex;
    flex-direction: row;
    padding: 1em 1em;
    justify-content: flex-end;
    align-items: center;
}

.cab a {
    color: #fff;
}

</style>
{% endblock %}

{% block conteudo %}

    <h2 style="color:#fff">{{titulo}}</h2>
    </div>
    <div class="texto-body">
        <!-- <div class="texto-body-input"> -->

                    <div class="drag-file">Arraste e solte ou <span style="color: #00c0ef;text-decoration: underline;cursor: pointer;"> clique aqui!</span></div>
                    <input type="file" class="file-input" style="display: none;" />

    <!-- <div id="perguntas_favoritas">
        <div class="titulo-header">Perguntas Favoritas</div>
        <div class="conteudo-documentos">
        <div id="grid-pergunta-chats">

        </div>
    </div> -->

    <div id="meus_documentos">
        <div class="titulo-header">{{titulo_tabela}}</div>
        <div class="conteudo-documentos">
            <table>
                <thead>
                    <th></th>
                    <th style="width: 30%;"></th>
                    <th style="width: 8%;"></th>

        </div>
    </div> 
    <br>

<input type="hidden"  id="user-id" value="{{request.user.id}}">
{% endblock %}

{% block extrajs %}
<script>
    const documentType = [
        'application/pdf'
    ]
    const audioTypes = [
        'audio/midi',
        'audio/mpeg',
        'audio/webm',
        'audio/ogg',
        'audio/wav',    
    ]
    const videoTypes = [
        'video/webm',
        'video/ogg',
        'video/mp4',
        'video/x-msvideo'
    ]
    const mediaTranscriptionTypes = audioTypes.concat(videoTypes)
    const allowedMedias = mediaTranscriptionTypes.concat(documentType)

    const dropArea = document.querySelector(".drag-area")
    const fileInput = dropArea.querySelector(".file-input")
    const userId = $("#user-id")
    const gridChats = $("#grid-documentos-chats")
    const gridQuestion = $("#grid-pergunta-chats")
    const body = document.querySelector('body')
    const tableDocumentosMedias = $("#table-documentos-medias")
    const loader = $("#preloader")
    
    fileInput.accept = allowedMedias.join(',')

    $(document).ready(() => {
        // loader.fadeIn()
        $.ajaxSetup({
            headers: {"X-CSRFToken": '{{ csrf_token }}' },
        });

        body.addEventListener('click', function(event) {
            if(event.target.classList.contains('btn-remove-chat')) {
                const chatId = event.target.attributes['data-remove-id'].value
                deleteChat(chatId)
                event.target.parentElement.parentElement.remove()
            }

            if(event.target.classList.contains('btn-remove-question')) {
                const chatId = event.target.attributes['data-id'].value
                deleteQuestion(chatId)
                event.target.parentElement.parentElement.remove()
            }        
        })


        fileInput.addEventListener("change", function (e) {
            const target = e.target;
            if(validateDocument(target)){
                const isTranscription = getIsTranscription(target)
                if(isTranscription) newTranscription(target)
                else newChat(target)
            }else{
                showMessage('Tipo de arquivo não suportado',3000)
            }
        });
        dropArea.onclick = () => {
            fileInput.click();
        };

        dropArea.addEventListener("dragover", (event) => {
            event.preventDefault();
            dropArea.classList.add("drag-active");
            console.log('dragover')
        });

        dropArea.addEventListener("dragleave", () => {
            dropArea.classList.remove("drag-active");
            console.log('dragleave')

        });

        dropArea.addEventListener("drop", (e) => {
            e.preventDefault();
            dropArea.classList.remove("drag-active")
            const target = e.dataTransfer;
            if(validateDocument(target)){
                const isTranscription = getIsTranscription(target)
                if(isTranscription) newTranscription(target)
                else newChat(target)
            }else{
                showMessage('Tipo de arquivo não suportado',3000)
            }
        });        

        getDocumentsChats()
        setInterval(() => getDocumentsChats(), 23000)
    })  

    function getDocumentsChats() {
        if(userId.val()) {
            getUserChats(userId.val(), '{{api}}')
            .then((data) => data.json())
            .then((data) => fillListChats(data.results))
        }
    }

    function validateDocument(target){
        const file = target.files[0]
        return allowedMedias.indexOf(file.type) != -1
    }

    function getIsTranscription(target){
        const file = target.files[0]
        return mediaTranscriptionTypes.indexOf(file.type) != -1
    }

    function newChat(target) {
        const file = target.files[0]
        const formData = new FormData()
        formData.append('titulo', file.name)
        formData.append('documento', file)
        formData.append('ativo', true)

        $.ajax({
            type:'POST',
            url: `/documento/api/chat/`,
            beforeSend: () => loader.fadeIn(),
            data: formData,
            contentType: false,
            processData: false,
            success: (data) => {
                window.location.href = `/documento/chat/?documento=${data.id}`
            },
            complete: () => loader.fadeOut()
        })

    }

    function newTranscription(target) {
        const file = target.files[0]
        const tipo = audioTypes.indexOf(file.type) != -1 ? 2 : 1
        const formData = new FormData()
        formData.append('titulo', file.name)
        formData.append('arquivo', file)
        formData.append('ativo', true)
        formData.append('tipo', tipo)

        $.ajax({
            type:'POST',
            url: `/documento/api/media-transcricao/`,
            beforeSend: () => loader.fadeIn(),
            data: formData,
            contentType: false,
            processData: false,
            success: (data) => {
                window.location.reload()
            },
            complete: () => loader.fadeOut()
        })

    }
    function fillListChats(chats) {
        let list = ''

        if(chats[0] && chats[0].chatpdf_source_id) {
            chats.forEach((c) => {
                list += `
                    <tr>
                        <td>${c.titulo}</td>
                        <td></td>
                        <td>
                            <a class="btn" href="/documento/{{redirect}}=${c.id}">
                                <i style="color:#00c0ef" class='fa fa-eye'></i>
                            </a>
                            <i data-remove-id='${c.id}' style="color:red" class='fa fa-trash btn-remove-chat'></i>    
                        </td>
                    </tr>
                `
            })
        } else {
            chats.forEach((c) => {
            list += `
                <tr>
                    <td>${c.titulo}</td>
                    <td>${c.status_str}</td>
                    <td style="display: flex; justify-content: end; align-items: center;">
                        ${c.status === 4 ? 
                            `<a class="btn"  href="/documento/{{redirect}}=${c.id}">
                                <i style="color:#00c0ef" class='fa fa-eye'></i>
                            </a>` : ''}
                        
                        ${[1, 4].includes(c.status)  ? 
                            `<i data-remove-id='${c.id}' style="color:red" class='fa fa-trash btn-remove-chat'></i>    
                            ` : ``}
                    </td>
                </tr>
            `
            })
        }
        tableDocumentosMedias.html(list)
    }

    function deleteChat(chatId) {
        if(chatId) {
            $.ajax({
                type: 'PATCH',
                url: `/documento/api/{{api}}/${chatId}/`,
                data: {
                    ativo: false
                },
                success: (data) => {
                    
                },
                error: () => {}
            })
        } 
    }

    function deleteQuestion(chatId) {
        if(chatId) {
            $.ajax({
                type: 'PATCH',
                url: `/documento/api/mensagem/${chatId}/`,
                data: {
                    is_favorito: false
                },
                success: (data) => {
                    
                },
                error: () => {}
            })
        } 
    }    

    function getQuestion(id){
        fetch(`/documento/api/mensagem/?criado_por=${id}&is_favorito=true`)
        .then(res=>res.json())
        .then(data=>{
            const questions = data.results.reduce((acc,d) => {
                acc += `<div class='question-div'>
                            <i style='font-weight: 900;' class="fa-regular fa-circle-question"></i>
                            <div>
                                ${d.texto}
                                <i style='color:#00c0ef;' data-id='${d.id}' class="fa fa-trash btn-remove-question"></i>
                            </div>
                        </div>`
                return acc
                
            },'')
            if(questions.length == 0){
               $('#perguntas_favoritas').hide()
            }
            gridQuestion.html(questions)
        })
    }     
    getQuestion(userId.val())      
</script>
{% endblock %}
